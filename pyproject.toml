[project]
name = "tradeboy"
version = "0.1.0"
description = "An autonomous forex trading desk run by debating Claude agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradeboy = "tradeboy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradeboy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
