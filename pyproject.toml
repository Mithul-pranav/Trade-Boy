[project]
name = "tradeboy"
version = "0.1.0"
description = "An autonomous trading desk run by debating Claude agents"
requires-python = ">=3.11"
# yfinance (Yahoo Finance) gives the stocks desk its daily history and earnings dates.
dependencies = ["anthropic>=2.1", "httpx>=0.27", "pyyaml>=6", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Local FinBERT headline tone (news.sentiment in settings). CPU-only torch keeps the download smaller:
# pip install torch --index-url https://download.pytorch.org/whl/cpu first.
# The slow macro research backtest (tradeboy macro-backtest).
research = ["numpy>=1.26", "pandas>=2.1"]
sentiment = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
tradeboy = "tradeboy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradeboy", "tradeboy.stocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
