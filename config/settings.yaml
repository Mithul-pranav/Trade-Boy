# Trade-Boy settings. Every number here is a starting default and can be changed.

pairs:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - AUD_USD
  - USD_CAD
  - USD_CHF
  - NZD_USD

# The desk trades only this budget, not the whole account. Profits stay in the budget and
# can be traded. If the budget is used up, the desk halts until Mithul approves more.
# The amount is converted to the account currency (SGD) once, when the desk starts.
capital:
  starting_amount: 100
  currency: USD

scanner:
  interval_minutes: 15

# Hard limits enforced in code. No agent can override these.
# Percentages below are of the desk's budget equity, not of the whole account.
risk:
  risk_per_trade_pct: 0.5      # max loss if the stop loss is hit
  max_open_trades: 3
  max_total_risk_pct: 2.0      # combined risk of all open trades
  daily_loss_limit_pct: 2.0    # no new trades for the rest of the trading day
  # Drawdown from peak budget equity that closes everything and halts. Leave empty to rely only on
  # the budget rule above (halt when the original budget is gone).
  max_drawdown_pct:
  news_blackout_minutes: 15    # no new trades this close to a high-impact release
  max_spread_pips: 3.0         # skip a pair while its spread is wider than this
  min_stop_pips: 5.0           # a tighter stop would make the position too big for the budget

# The Claude agents. Debates only run when the free code screen finds a setup.
claude:
  scanner_model: claude-haiku-5-5    # only asked when several pairs pass the screen at once
  analyst_model: claude-sonnet-5-5   # technical, macro, positioning, skeptic, risk manager
  head_model: claude-opus-5-5        # the final call gets the strongest model
  analyst_effort: medium
  head_effort: high
  # API spend caps in USD. Hitting either pauses debates until it resets; trading limits still apply.
  daily_budget_usd: 0.90             # rolling 24 hours; about 22 trading days fit in the monthly cap
  monthly_budget_usd: 20.0           # Mithul's prepaid credits
  max_debates_per_day: 3
  max_pairs_per_scan: 1
  debate_cooldown_hours: 4           # don't re-debate the same pair sooner than this
  web_searches_per_agent: 2          # macro and positioning analysts search the web for news and COT data

# Economic calendar for the news blackout (weekly JSON in the Forex Factory export format).
# When placing trades, an unreachable calendar blocks new trades rather than skipping the check.
calendar:
  url: https://nfs.faireconomy.media/ff_calendar_thisweek.json

# Free news headlines for the macro analyst, read in code so it has news even without web search.
# Central bank feeds tag every item with their currency; general feeds are matched by keyword.
# A feed that can't be read is shown to the agents as a data gap.
news:
  feeds:
    - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", currencies: [USD]}
    - {name: ECB, url: "https://www.ecb.europa.eu/rss/press.html", currencies: [EUR]}
    - {name: Bank of England, url: "https://www.bankofengland.co.uk/rss/news", currencies: [GBP]}
    - {name: Bank of Japan, url: "https://www.boj.or.jp/en/rss/whatsnew.xml", currencies: [JPY]}
    - {name: RBA, url: "https://www.rba.gov.au/rss/rss-cb-media-releases.xml", currencies: [AUD]}
    - {name: Bank of Canada, url: "https://www.bankofcanada.ca/content_type/press-releases/feed/", currencies: [CAD]}
    - {name: FXStreet, url: "https://www.fxstreet.com/rss/news"}

journal:
  path: data/journal.sqlite3
