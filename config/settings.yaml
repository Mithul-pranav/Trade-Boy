# Trade-Boy settings. Every number here is a starting default and can be changed.

pairs:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - AUD_USD
  - USD_CAD
  - USD_CHF
  - NZD_USD

# The desk trades only this budget, not the whole account. Profits stay in the budget and
# can be traded. If the budget is used up, the desk halts until Mithul approves more.
# The amount is converted to the account currency (SGD) once, when the desk starts.
capital:
  starting_amount: 1000          # Mithul raised it from 100 on 2026-10-22 for demo trading
  currency: USD

scanner:
  interval_minutes: 15

# Hard limits enforced in code. No agent can override these.
# Percentages below are of the desk's budget equity, not of the whole account.
risk:
  risk_per_trade_pct: 0.5      # max loss if the stop loss is hit
  max_open_trades: 3
  max_total_risk_pct: 2.0      # combined risk of all open trades
  daily_loss_limit_pct: 2.0    # no new trades for the rest of the trading day
  # Drawdown from peak budget equity that closes everything and halts. Leave empty to rely only on
  # the budget rule above (halt when the original budget is gone).
  max_drawdown_pct:
  news_blackout_minutes: 15    # no new trades this close to a high-impact release
  max_spread_pips: 3.0         # skip a pair while its spread is wider than this
  min_stop_pips: 5.0           # a tighter stop would make the position too big for the budget

# The Claude agents. Debates only run when the free code screen finds a setup.
claude:
  scanner_model: claude-haiku-5-5    # only asked when several pairs pass the screen at once
  analyst_model: claude-sonnet-5-5   # technical, macro, positioning, skeptic, risk manager
  head_model: claude-opus-5-5        # the final call gets the strongest model
  analyst_effort: medium
  head_effort: high
  # API spend caps in USD. Hitting either pauses debates until it resets; trading limits still apply.
  daily_budget_usd: 0.90             # rolling 24 hours; about 22 trading days fit in the monthly cap
  monthly_budget_usd: 20.0           # Mithul's prepaid credits
  max_debates_per_day: 3
  max_pairs_per_scan: 1
  debate_cooldown_hours: 4           # don't re-debate the same pair sooner than this
  web_searches_per_agent: 2          # macro and positioning analysts search the web for news and COT data

# Economic calendar for the news blackout (weekly JSON in the Forex Factory export format).
# When placing trades, an unreachable calendar blocks new trades rather than skipping the check.
calendar:
  url: https://nfs.faireconomy.media/ff_calendar_thisweek.json

# Free news headlines for the macro analyst, read in code so it has news even without web search.
# Central bank feeds tag every item with their currency; general feeds are matched by keyword.
# google_news entries are Google News RSS searches (no key), limited to the last 2 days.
# Each feed contributes at most max_items (default 10) of its newest matching headlines.
# A feed that can't be read is shown to the agents as a data gap.
news:
  # FinBERT headline tone. Off by default: it needs torch (~2 GB disk, ~1 GB RAM) and only scores
  # tone, not direction for a pair. Install with: pip install -e '.[sentiment]'
  sentiment: false
  feeds:
    - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", currencies: [USD]}
    - {name: ECB, url: "https://www.ecb.europa.eu/rss/press.html", currencies: [EUR]}
    - {name: Bank of England, url: "https://www.bankofengland.co.uk/rss/news", currencies: [GBP]}
    - {name: Bank of Japan, url: "https://www.boj.or.jp/en/rss/whatsnew.xml", currencies: [JPY]}
    - {name: RBA, url: "https://www.rba.gov.au/rss/rss-cb-media-releases.xml", currencies: [AUD]}
    - {name: Bank of Canada, url: "https://www.bankofcanada.ca/content_type/press-releases/feed/", currencies: [CAD]}
    # FXStreet (www.fxstreet.com/rss/news) is left out: it answers scripts with a Cloudflare "Just a moment"
    # challenge page (403), so it could only ever show up as a data gap.
    - {name: Google News USD, google_news: '"Federal Reserve" OR FOMC OR "US dollar"', currencies: [USD]}
    - {name: Google News EUR, google_news: 'ECB OR "euro zone" OR "EUR/USD"', currencies: [EUR]}
    - {name: Google News GBP, google_news: '"Bank of England" OR sterling OR "GBP/USD"', currencies: [GBP]}
    - {name: Google News JPY, google_news: '"Bank of Japan" OR yen OR "USD/JPY"', currencies: [JPY]}
    - {name: Google News AUD, google_news: 'RBA OR "Australian dollar"', currencies: [AUD]}
    - {name: Google News CAD, google_news: '"Bank of Canada" OR "Canadian dollar"', currencies: [CAD]}
    - {name: Google News CHF, google_news: 'SNB OR "Swiss National Bank" OR "Swiss franc"', currencies: [CHF]}
    - {name: Google News NZD, google_news: 'RBNZ OR "New Zealand dollar"', currencies: [NZD]}

# Macro data from FRED's public CSV downloads (no key), refreshed once a day. The macro analyst sees
# the series for the pair's two currencies. kind: yoy turns an index (CPI) into a year-on-year change.
# Outside the US, FRED has few daily series, so most are the OECD's monthly 10-year yields.
macro:
  fred_series:
    - {id: DFF, name: Fed funds rate, currency: USD}
    - {id: DGS3MO, name: US 3-month Treasury yield, currency: USD}
    - {id: DGS2, name: US 2-year Treasury yield, currency: USD}
    - {id: DGS10, name: US 10-year Treasury yield, currency: USD}
    - {id: CPIAUCSL, name: US CPI, currency: USD, kind: yoy}
    - {id: UNRATE, name: US unemployment rate, currency: USD}
    - {id: DTWEXBGS, name: Broad US dollar index, currency: USD}
    - {id: ECBDFR, name: ECB deposit facility rate, currency: EUR}
    - {id: IRLTLT01DEM156N, name: Germany 10-year yield (monthly), currency: EUR}
    - {id: IRLTLT01GBM156N, name: UK 10-year yield (monthly), currency: GBP}
    - {id: IRLTLT01JPM156N, name: Japan 10-year yield (monthly), currency: JPY}
    - {id: IRLTLT01AUM156N, name: Australia 10-year yield (monthly), currency: AUD}
    - {id: IRLTLT01CAM156N, name: Canada 10-year yield (monthly), currency: CAD}
    - {id: IRLTLT01CHM156N, name: Switzerland 10-year yield (monthly), currency: CHF}
    - {id: IRLTLT01NZM156N, name: New Zealand 10-year yield (monthly), currency: NZD}

# Backtest of the code-level rules and the quant seat's signals (tradeboy history, then tradeboy backtest).
# Trades pay the real historical bid/ask spread, plus the slippage and financing below.
backtest:
  first_test: 2019-01-01        # walk-forward test windows start here; earlier years are only for choosing
  holdout_start: 2025-10-22     # the last year is kept back and checked once, at the end
  end: 2026-10-22
  train_years: 3                # a strategy is traded in a window only if it showed an edge in these years
  test_months: 6
  costs:
    slippage_pips: 0.2          # per side, on top of the spread
    financing_markup_pct: 0.8   # OANDA's yearly financing charge on top of the interest rate gap
  selection:                    # what a strategy must show in its training years to be traded next
    min_trades: 60
    min_avg_r: 0.0
    min_t_stat: 2.0
  # The pass bar: all of these must hold, out of sample, before demo trading starts.
  pass_bar:
    min_trades: 300             # out-of-sample trades across all test windows
    min_avg_r: 0.05             # average profit per trade after costs, in units of the amount risked
    min_t_stat: 2.0             # about 95% sure the average is above zero (monthly results)
    min_profit_factor: 1.1      # money won / money lost
    max_drawdown_pct: 20.0      # worst drop of the 100 USD budget at 0.5% risk per trade
    min_positive_windows_pct: 60.0
    stress_extra_pips: 0.5      # still profitable when every trade costs this much more
    holdout_min_avg_r: 0.0
    pays_for_debates: true      # profit per trade at normal size must exceed one debate's API cost
  api_cost_per_trade: 0.15      # USD: the middle of the measured 0.11 to 0.21 per debate

journal:
  path: data/journal.sqlite3
